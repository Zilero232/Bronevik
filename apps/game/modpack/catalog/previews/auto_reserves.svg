<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360"><rect width="640" height="360" fill="#18181b"/><g transform="translate(120 50)" font-family="Segoe UI, Arial, sans-serif"><rect width="400" height="260" rx="10" fill="#1f1f23" stroke="#3a3a42"/><text x="24" y="40" font-size="18" font-weight="700" fill="#f2f2f3">Автоактивация резервов</text><text x="24" y="80" font-size="15" fill="#f2f2f3">Резерв на кредиты</text><text x="376" y="80" font-size="15" fill="#4ade80" text-anchor="end">вкл.</text><text x="24" y="114" font-size="15" fill="#f2f2f3">Резерв на опыт экипажа</text><text x="376" y="114" font-size="15" fill="#4ade80" text-anchor="end">вкл.</text><text x="24" y="148" font-size="15" fill="#f2f2f3">Резерв на опыт</text><text x="376" y="148" font-size="15" fill="#a3a3ad" text-anchor="end">выкл.</text><text x="24" y="182" font-size="15" fill="#f2f2f3">Когда включать</text><text x="376" y="182" font-size="15" fill="#a3a3ad" text-anchor="end">при запуске</text><rect x="24" y="206" width="352" height="34" rx="6" fill="none" stroke="#ff7a1a"/><text x="200" y="228" font-size="14" font-weight="700" fill="#ff7a1a" text-anchor="middle">Включить выбранные сейчас</text></g></svg>
