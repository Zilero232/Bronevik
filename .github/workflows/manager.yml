name: manager

# The modpack manager (Tauri 2) checks and a test build (docs/ops/deploy.md «CI workflows»).

on:
  pull_request:
    paths:
      - 'apps/game/manager/**'
      - 'packages/design-tokens/**'
      - 'packages/icons/**'
      - .github/workflows/manager.yml
  workflow_dispatch:

concurrency:
  group: manager-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_TERM_COLOR: always
  MANIFEST: apps/game/manager/tauri/Cargo.toml

jobs:
  checks:
    permissions:
      contents: read

    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: bun --filter @otmetki/manager typecheck

      - run: bunx vitest run --project manager

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/game/manager/tauri -> target

      - run: cargo fmt --manifest-path ${{ env.MANIFEST }} --check

      - run: cargo clippy --manifest-path ${{ env.MANIFEST }} --all-targets --locked -- -D warnings

      - run: cargo test --manifest-path ${{ env.MANIFEST }} --locked

  bundle:
    if: github.event_name == 'workflow_dispatch'
    needs: checks

    permissions:
      contents: read

    runs-on: windows-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: apps/game/manager

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/game/manager/tauri -> target

      # Without the signing secret (forks) the updater artifacts are skipped.
      - name: Build the installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            bun run build
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: building without updater artifacts"
            bun run build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: modpack-manager
          path: |
            apps/game/manager/tauri/target/release/bundle/nsis/*.exe
            apps/game/manager/tauri/target/release/bundle/nsis/*.sig
          retention-days: 14
