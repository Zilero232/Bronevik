# Three Marks production-like stack, front to back:
#   caddy → client → server → timescaledb + redis, with worker beside the server.
#
# Not deployed anywhere yet — there is no production. The file exists so the
# stack can be brought up the moment there is one, and so the images are
# exercised end to end locally:
#
#   docker compose build
#   docker compose up -d
#   docker compose logs -f
#
# `server` and `worker` run the same image (apps/web/server/Dockerfile): the API is
# src/main.ts, the collector worker is src/worker.ts. The worker has no HTTP
# port; its heartbeat and the Lesta circuit state show up in the server's
# /health, and bull-board is served by the server on /admin/queues.
#
# Everything reads the root .env. The URLs in it point at localhost for dev;
# inside compose the services reach each other by name, so the overrides below
# win for DATABASE_URL, DIRECT_URL and REDIS_URL.
#
# The keyless demo (generated data, no Lesta key) is the override
# docker-compose.demo.yml; docs/ops/deploy.md «Демо-деплой без ключей».

x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 20s

# Docker's json-file driver never rotates by default; a chatty worker would fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

x-backend-env: &backend-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
  DIRECT_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
  REDIS_URL: redis://redis:6379

services:
  caddy:
    image: caddy:2-alpine
    container_name: otmetki-caddy
    restart: always
    logging: *logging
    depends_on:
      client:
        condition: service_healthy
      server:
        condition: service_healthy
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?}
      API_DOMAIN: ${API_DOMAIN:?}
    ports:
      # 80 carries the Let's Encrypt challenge, 443 the site.
      - '80:80'
      - '443:443'
      # HTTP/3 (QUIC), which Caddy serves by default.
      - '443:443/udp'
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - otmetki

  client:
    build:
      context: .
      dockerfile: apps/web/client/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?}
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-false}
        GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-}
    image: ghcr.io/zilero232/otmetki-client:latest
    container_name: otmetki-client
    restart: always
    logging: *logging
    depends_on:
      - server
    environment:
      # Server-only (never NEXT_PUBLIC_): the Next server signs its API calls with it so
      # the API rate-limits the visitor, not the Next server. Same value the server reads from .env.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?}
    expose:
      - '3000'
    networks:
      - otmetki

  server:
    build:
      context: .
      dockerfile: apps/web/server/Dockerfile
    image: ghcr.io/zilero232/otmetki-server:latest
    container_name: otmetki-server
    restart: always
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      <<: *backend-env
      PORT: '4000'
    expose:
      - '4000'
    volumes:
      # Local replay storage (REPLAY_STORAGE=local) and the armor models live
      # under .data; without a volume they vanish with the container.
      - serverdata:/app/apps/web/server/.data
    networks:
      - otmetki

  worker:
    image: ghcr.io/zilero232/otmetki-server:latest
    container_name: otmetki-worker
    restart: always
    logging: *logging
    command: [bun, src/worker.ts]
    # The image's HEALTHCHECK probes the API port, which the worker never opens;
    # its liveness shows up as the heartbeat in the server's /health instead.
    healthcheck:
      disable: true
    depends_on:
      server:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      <<: *backend-env
    volumes:
      - serverdata:/app/apps/web/server/.data
    networks:
      - otmetki

  postgres:
    image: timescale/timescaledb-ha:pg17
    container_name: otmetki-postgres
    restart: always
    logging: *logging
    # Docker's 64 MB /dev/shm is too small for parallel query workers.
    shm_size: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    ports:
      # Loopback only: Docker's rules sit ahead of UFW, so a published port
      # would face the internet. Reach it over an ssh tunnel.
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/home/postgres/pgdata/data
    networks:
      - otmetki
    healthcheck:
      <<: *healthcheck
      # Over TCP: on the first boot the image runs initdb on a socket-only
      # temporary server, which a socket probe would already report ready.
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      retries: 5
      start_period: 30s

  redis:
    image: redis:8-alpine
    container_name: otmetki-redis
    restart: always
    logging: *logging
    # BullMQ needs keys to survive eviction; AOF keeps queued jobs across restarts.
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    networks:
      - otmetki
    healthcheck:
      <<: *healthcheck
      test: [CMD, redis-cli, ping]

  # Nightly pg_dump in the custom format (pg_restore-able), rotated: 7 daily,
  # 4 weekly, 6 monthly. The dumps stay on this host — copy them off it
  # (docs/ops/deploy.md «Бэкапы»); a disk failure takes both otherwise.
  backup:
    image: prodrigestivill/postgres-backup-local:17
    container_name: otmetki-backup
    restart: always
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_EXTRA_OPTS: -Fc -Z6
      BACKUP_SUFFIX: .dump
      SCHEDULE: '0 4 * * *'
      BACKUP_KEEP_DAYS: '7'
      BACKUP_KEEP_WEEKS: '4'
      BACKUP_KEEP_MONTHS: '6'
    volumes:
      - pgbackups:/backups
    networks:
      - otmetki

networks:
  otmetki:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  pgbackups:
  redisdata:
  serverdata:
