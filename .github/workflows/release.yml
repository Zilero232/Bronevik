name: release

# Publishes a modpack release and the manager to the VPS (docs/ops/deploy.md §4).

on:
  workflow_dispatch:
    inputs:
      force:
        description: Publish even if this modpack version is already released (replaces it)
        type: boolean
        default: false
      dry_run:
        description: Build everything, publish nothing
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  check:
    permissions:
      contents: read

    environment: production

    runs-on: ubuntu-24.04
    timeout-minutes: 10

    outputs:
      version: ${{ steps.source.outputs.version }}
      games: ${{ steps.source.outputs.games }}

    steps:
      - name: Check the secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PASSWORD: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          failed=0

          for name in TAURI_SIGNING_PRIVATE_KEY NEXT_PUBLIC_SITE_URL DEPLOY_SSH_HOST DEPLOY_SSH_USER DEPLOY_SSH_PASSWORD DEPLOY_PATH; do
            if [ -z "${!name}" ]; then
              echo "::error::secret $name is not set (docs/ops/deploy.md §1 «GitHub repository secrets»)"
              failed=1
            fi
          done

          if [[ -n "$NEXT_PUBLIC_SITE_URL" && "$NEXT_PUBLIC_SITE_URL" != https://* ]]; then
            echo "::error::NEXT_PUBLIC_SITE_URL must be https: the manager downloads only over https"
            failed=1
          fi

          exit "$failed"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # 404 means nothing is published yet.
      - name: Read the published index
        env:
          SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: |
          url="${SITE_URL%/}/downloads/releases.json"
          status=$(curl -sS --retry 3 -o "$RUNNER_TEMP/current.json" -w '%{http_code}' "$url")

          case "$status" in
            200) ;;
            404) rm -f "$RUNNER_TEMP/current.json" && echo "no index at $url yet" ;;
            *) echo "::error::GET $url answered $status" && exit 1 ;;
          esac

      - name: Read the version and the supported clients
        id: source
        env:
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--current "$RUNNER_TEMP/current.json")
          if [ "$FORCE" = true ] || [ "$DRY_RUN" = true ]; then
            args+=(--force)
          fi

          bun apps/web/server/scripts/modpack-release.ts source "${args[@]}" | tee -a "$GITHUB_OUTPUT"

  modpack:
    needs: check

    permissions:
      contents: read

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/modpack-release

      - name: Check the version against the catalogue
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          built=$(jq -r .modpackVersion dist/catalog/components.json)

          if [ "$built" != "$VERSION" ]; then
            echo "::error::the build is modpack $built, not $VERSION from apps/game/modpack/package.json"
            exit 1
          fi

          test -f "dist/modpack/otmetki.$VERSION.mtmod"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-modpack
          path: dist/modpack/
          retention-days: 1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-catalog
          path: dist/catalog/
          retention-days: 1

  manager:
    needs: modpack

    permissions:
      contents: read

    environment: production

    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/game/manager/tauri -> target

      # Ship this release's catalogue so a fresh install needs no download.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-catalog
          path: apps/game/manager/tauri/resources

      - name: Build the installer
        shell: bash
        working-directory: apps/game/manager
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          bun run build

          shopt -s nullglob
          installers=(tauri/target/release/bundle/nsis/*-setup.exe)

          if [ "${#installers[@]}" -ne 1 ] || [ ! -f "${installers[0]}.sig" ]; then
            echo "::error::expected one NSIS installer with its .sig, found: ${installers[*]:-none}"
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-manager
          path: |
            apps/game/manager/tauri/target/release/bundle/nsis/*-setup.exe
            apps/game/manager/tauri/target/release/bundle/nsis/*-setup.exe.sig
          retention-days: 1

  publish:
    needs: [check, modpack, manager]
    if: ${{ !inputs.dry_run }}

    permissions:
      contents: read

    environment: production

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      VERSION: ${{ needs.check.outputs.version }}
      GAMES: ${{ needs.check.outputs.games }}
      SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      STAGING: ${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-modpack
          path: dist/modpack

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-catalog
          path: dist/catalog

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-manager
          path: dist/manager

      # Any error but 404 stops: a fresh index would drop every published release.
      - name: Read the published index
        run: |
          url="${SITE_URL%/}/downloads/releases.json"
          status=$(curl -sS --retry 3 -o dist/current.json -w '%{http_code}' "$url")

          case "$status" in
            200) echo "extending $url" ;;
            404) rm -f dist/current.json && echo "no index at $url yet: starting a new one" ;;
            *) echo "::error::GET $url answered $status" && exit 1 ;;
          esac

      - name: Describe the release
        run: |
          downloads="${SITE_URL%/}/downloads"
          manager_version=$(jq -r .version apps/game/manager/package.json)
          installer=$(find dist/manager -name '*-setup.exe' -print -quit)

          {
            echo "DOWNLOADS=$downloads"
            echo "MANAGER_VERSION=$manager_version"
            echo "MANAGER_FILE=otmetki-manager_${manager_version}_x64-setup.exe"
            echo "INSTALLER=$installer"
          } >> "$GITHUB_ENV"

      - name: Build the release entry and its payload
        run: |
          bun apps/web/server/scripts/modpack-release.ts prepare \
            --version "$VERSION" --games "$GAMES" \
            --catalog dist/catalog/components.json --packages dist/modpack \
            --base-url "$DOWNLOADS/modpack/$VERSION" --out dist/release

      - name: Sign the payload
        working-directory: apps/game/manager
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bunx tauri signer sign "$GITHUB_WORKSPACE/dist/release/release.txt"

      - name: Lay out the downloads folder
        run: |
          publish=dist/publish
          mkdir -p "$publish/modpack/$VERSION/catalog" "$publish/manager/$MANAGER_VERSION"

          cp dist/modpack/*.mtmod "$publish/modpack/$VERSION/"
          cp -R dist/catalog/. "$publish/modpack/$VERSION/catalog/"
          cp "dist/modpack/otmetki.$VERSION.mtmod" "$publish/otmetki.mtmod"
          cp "$INSTALLER" "$publish/manager/$MANAGER_VERSION/$MANAGER_FILE"
          cp "$INSTALLER.sig" "$publish/manager/$MANAGER_VERSION/$MANAGER_FILE.sig"
          cp "$INSTALLER" "$publish/otmetki-manager-setup.exe"

          bun apps/web/server/scripts/modpack-release.ts index \
            --current dist/current.json \
            --release dist/release/release.json --signature dist/release/release.txt.sig \
            --manager-version "$MANAGER_VERSION" --manager-url "$DOWNLOADS/manager/$MANAGER_VERSION/$MANAGER_FILE" \
            --manager-signature "$INSTALLER.sig" \
            --out "$publish/releases.json"

          find "$publish" -type f | sort

      - name: Upload to the VPS
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          source: dist/publish
          target: ${{ secrets.DEPLOY_PATH }}/.downloads-staging/${{ env.STAGING }}
          strip_components: 2
          overwrite: true

      # Same-filesystem renames, releases.json last: the index never names a missing file.
      - name: Publish
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          envs: DEPLOY_PATH,STAGING,VERSION,MANAGER_VERSION
          script: |
            set -euo pipefail

            downloads="$DEPLOY_PATH/downloads"
            staging="$DEPLOY_PATH/.downloads-staging/$STAGING"
            trap 'rm -rf "$staging"' EXIT

            if [ ! -d "$downloads" ]; then
              echo "$downloads does not exist: create it once (mkdir -p $downloads) and redeploy (docs/ops/deploy.md)" >&2
              exit 1
            fi

            chmod -R a+rX "$staging"
            mkdir -p "$downloads/modpack" "$downloads/manager"

            for dir in "modpack/$VERSION" "manager/$MANAGER_VERSION"; do
              rm -rf "$downloads/$dir.old"
              if [ -e "$downloads/$dir" ]; then
                mv "$downloads/$dir" "$downloads/$dir.old"
              fi
              mv "$staging/$dir" "$downloads/$dir"
              rm -rf "$downloads/$dir.old"
            done

            for file in otmetki.mtmod otmetki-manager-setup.exe releases.json; do
              mv -f "$staging/$file" "$downloads/$file"
            done

            echo "published modpack $VERSION and manager $MANAGER_VERSION to $downloads"
