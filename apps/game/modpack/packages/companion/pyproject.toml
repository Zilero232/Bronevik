# Game-client package: runs on the client's CPython 2.7. requires-python is for the host tooling (tests on 3.x).

[project]
name = "otmetki-companion"
version = "0.1.0"
description = "Three Marks companion: binding, signed ingest outbox, own battle results, MoE data and streamer settings share; hosts the features."
requires-python = ">=3.10"
license = { text = "UNLICENSED" }
authors = [{ name = "Alexandr Artemev" }]
dependencies = ["otmetki-core"]

[tool.uv]
package = false

[tool.uv.sources]
otmetki-core = { workspace = true }
