name: modpack

# The «Мир танков» modpack (apps/game/modpack): Python 2.7 game-client packages with Python 3 host tooling.
#
# checks         pull requests that touch the modpack, and manual runs. Windows, like the players:
#                pytest + the stdlib runner, ruff, vermin (the py2.7 syntax guard is a test).
# release-build  manual runs only. .github/actions/modpack-release builds OpenWG owg_python_compiler
#                from source (no Python 2.7 needed), the release packages with compiled .pyc (artifact
#                `modpack`) and the component catalogue around them (components.json with sha256 +
#                previews, artifact `modpack-catalog`) for the manager (apps/game/manager). A build to
#                look at; publishing to the VPS is release.yml, which runs the same action.

on:
  pull_request:
    paths:
      - 'apps/game/modpack/**'
      - '.github/actions/modpack-release/**'
      - .github/workflows/modpack.yml
  workflow_dispatch:

concurrency:
  group: modpack-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  checks:
    permissions:
      contents: read

    runs-on: windows-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/game/modpack

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - run: python -m pip install uv

      - run: uv sync --locked

      - run: uv run --locked pytest

      # The same suites through the stdlib runner the pre-commit hook uses.
      - run: python tools/run_tests.py

      - run: uv run --locked ruff check .

      - run: uv run --locked vermin --no-tips --violations -t=2.7- -t=3.0- --exclude-regex "tests|tools|vendor" packages features

  release-build:
    if: github.event_name == 'workflow_dispatch'

    permissions:
      contents: read

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/modpack-release

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: modpack
          path: dist/modpack/
          retention-days: 14

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: modpack-catalog
          path: dist/catalog/
          retention-days: 14
