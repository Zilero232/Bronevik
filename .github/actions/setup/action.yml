name: Setup toolchain
description: Bun and the caches every job in this repo needs.

runs:
  using: composite

  steps:
    # packageManager in the root package.json pins the Bun version.
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version-file: package.json

    - name: Cache bun packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    # postinstall runs prisma generate, which needs DIRECT_URL but never connects.
    - name: Install dependencies
      shell: bash
      env:
        DATABASE_URL: postgresql://placeholder
        DIRECT_URL: postgresql://placeholder
      run: bun install --frozen-lockfile

    # shared/api/generated is gitignored; built offline from the committed OpenAPI.
    - name: Generate the client API
      shell: bash
      run: bun --filter @otmetki/client api:build
