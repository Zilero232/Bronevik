name: manager

# The modpack manager (apps/game/manager): a Tauri 2 desktop app, Rust core in tauri/, React UI in web/.
# It is how players install the modpack (the Inno Setup installer it replaced is gone); its catalogue
# (components.json + previews) comes from .github/actions/modpack-release (modpack.yml, release.yml).
#
# checks  pull requests that touch the manager, the packages its UI reads, or this file; manual runs.
#         Windows, like the players: the UI typecheck and its Vitest project, then cargo fmt, clippy and
#         the Rust tests. The Rust contract test fails when tauri/contract/*.json no longer matches the
#         serialised commands (rerun it locally with OTMETKI_UPDATE_FIXTURES=1 and commit the result).
# bundle  manual runs only, after checks. `tauri build`: the NSIS installer (ru/en, per user, unsigned),
#         plus the updater archive and its minisign signature when the TAURI_SIGNING_PRIVATE_KEY secret
#         is set (without it the updater artifacts are skipped, the installer is still built). Uploaded as
#         the `modpack-manager` artifact, a build to look at. Publishing to the VPS is release.yml
#         (README «Releases»), which builds the installer with the release catalogue itself.

on:
  pull_request:
    paths:
      - 'apps/game/manager/**'
      - 'packages/design-tokens/**'
      - 'packages/icons/**'
      - .github/workflows/manager.yml
  workflow_dispatch:

concurrency:
  group: manager-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_TERM_COLOR: always
  MANIFEST: apps/game/manager/tauri/Cargo.toml

jobs:
  checks:
    permissions:
      contents: read

    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: bun --filter @otmetki/manager typecheck

      - run: bunx vitest run --project manager

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/game/manager/tauri -> target

      - run: cargo fmt --manifest-path ${{ env.MANIFEST }} --check

      - run: cargo clippy --manifest-path ${{ env.MANIFEST }} --all-targets --locked -- -D warnings

      - run: cargo test --manifest-path ${{ env.MANIFEST }} --locked

  bundle:
    if: github.event_name == 'workflow_dispatch'
    needs: checks

    permissions:
      contents: read

    runs-on: windows-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: apps/game/manager

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/game/manager/tauri -> target

      # The updater archive must be signed with the key whose public half is in tauri.conf.json
      # (plugins.updater.pubkey). Forks and runs without the secret still get the installer.
      - name: Build the installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            bun run build
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: building without updater artifacts"
            bun run build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: modpack-manager
          path: |
            apps/game/manager/tauri/target/release/bundle/nsis/*.exe
            apps/game/manager/tauri/target/release/bundle/nsis/*.sig
          retention-days: 14
