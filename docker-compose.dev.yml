services:
  postgres:
    image: timescale/timescaledb-ha:pg17
    container_name: otmetki-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: bronevik
      POSTGRES_PASSWORD: bronevik
      POSTGRES_DB: bronevik
    ports:
      # 5434 on the host: 5432 is taken by a native service, 5433 by GnomeVPN.
      - '5434:5432'
    volumes:
      - bronevik-postgres-data:/home/postgres/pgdata/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U bronevik -d bronevik]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: otmetki-redis-dev
    restart: unless-stopped
    ports:
      - '6380:6379'
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: otmetki-mailpit-dev
    restart: unless-stopped
    ports:
      # SMTP catcher on 1025, web inbox on http://localhost:8025. Nothing leaves the machine.
      - '1025:1025'
      - '8025:8025'
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  bronevik-postgres-data:
    name: bronevik_bronevik-postgres-data
