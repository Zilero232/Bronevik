[package]
name = "otmetki-manager"
version = "0.1.0"
description = "Three Marks modpack manager"
authors = ["Alexandr Artemev"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "otmetki_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
encoding_rs = "0.8"
flate2 = "1"
getrandom = "0.3"
glob = "0.3"
hex = "0.4"
log = "0.4"
minisign-verify = "0.2"
reqwest = { version = "0.13", features = ["json", "query"] }
roxmltree = "0.20"
rust-ini = "0.21"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sys-locale = "0.3"
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["time", "sync"] }
walkdir = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }

[dev-dependencies]
ring = "0.17"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
