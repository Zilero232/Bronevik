# Game-client package: runs on the client's CPython 2.7. requires-python is for the host tooling (tests on 3.x).

[project]
name = "otmetki-feature-event-trackers"
version = "0.1.0"
description = "Feature: hangar cards of the limited-time events from the player's own data: Triathlon rounds (the best clean-XP battles in 60 minutes) and the Trading Caravan tokens."
requires-python = ">=3.10"
license = { text = "UNLICENSED" }
authors = [{ name = "Alexandr Artemev" }]
dependencies = ["otmetki-core", "otmetki-companion"]

[tool.uv]
package = false

[tool.uv.sources]
otmetki-core = { workspace = true }
otmetki-companion = { workspace = true }
