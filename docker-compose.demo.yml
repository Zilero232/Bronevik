# Keyless public demo — an override of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d
#
# or, on the VPS, `COMPOSE_FILE=docker-compose.yml:docker-compose.demo.yml` in
# the .env next to the compose files, so every plain `docker compose` (the
# deploy workflow's included) picks the demo up. docs/ops/deploy.md
# «Демо-деплой без ключей» has the whole procedure.
#
# What it changes:
#   - DEMO_MODE=true on the server and the worker: the in-process Lesta mock
#     serves generated players, clans and battles from a production build. The
#     server refuses to boot when LESTA_APPLICATION_ID or YOOKASSA_* is set, so
#     a real key cannot be mixed with fake data.
#   - demo-seed, a one-shot service from the server image: syncs the schema
#     (db:deploy), imports the game catalog from the public client-data repos
#     and runs dev-seed. Each step is skipped when its tables already have
#     rows, so it re-runs cheaply on every `up`. The server and the worker
#     start after it succeeds: the mock builds its world from the catalog once,
#     at boot.
#   - Caddy imports infra/caddy/demo.caddy: X-Robots-Tag noindex on every
#     response and a Disallow-all robots.txt, for both hosts.
#   - The client image is built with NEXT_PUBLIC_DEMO_MODE=true (the
#     «Демо-данные» banner). A CI-built image takes it from the deploy
#     workflow's `demo` input instead.

services:
  demo-seed:
    # The server's definition in docker-compose.yml (image, .env, database
    # URLs), not the worker's: the worker waits for the server, which here
    # waits for this service.
    extends:
      file: docker-compose.yml
      service: server
    container_name: otmetki-demo-seed
    # Same image as the server: `docker compose build` builds it once, for the server.
    build: !reset null
    expose: !reset []
    restart: 'no'
    healthcheck:
      disable: true
    # DEMO_SEED_ARGS go to dev-seed, e.g. `--accounts 300 --days 30` for a
    # quicker first boot (defaults: 600 accounts over 90 days).
    command: [sh, -c, 'bun run db:deploy && bun scripts/demo-seed.ts ${DEMO_SEED_ARGS:-}']
    environment:
      DEMO_MODE: 'true'

  server:
    depends_on:
      demo-seed:
        condition: service_completed_successfully
    environment:
      DEMO_MODE: 'true'

  worker:
    depends_on:
      demo-seed:
        condition: service_completed_successfully
    environment:
      DEMO_MODE: 'true'

  client:
    build:
      args:
        NEXT_PUBLIC_DEMO_MODE: 'true'

  caddy:
    volumes:
      - ./infra/caddy/demo.caddy:/etc/caddy/conf.d/demo.caddy:ro
