# Game-client package: runs on the client's CPython 2.7. requires-python is for the host tooling (tests on 3.x).

[project]
name = "otmetki-feature-free-camera"
version = "0.1.0"
description = "Feature: the client's own video camera flown in replays and in the hangar, never in a live battle."
requires-python = ">=3.10"
license = { text = "UNLICENSED" }
authors = [{ name = "Alexandr Artemev" }]
dependencies = ["otmetki-core", "otmetki-companion"]

[tool.uv]
package = false

[tool.uv.sources]
otmetki-core = { workspace = true }
otmetki-companion = { workspace = true }
