name: deploy

# Images go to ghcr, then the VPS pulls them. The web image and the server image
# (also run as the worker) build in parallel jobs that share
# .github/actions/docker-image. The VPS holds no clone of the repository, so
# the compose files and infra/caddy are copied on every deploy, keeping their
# repository paths (docker-compose.yml bind-mounts ./infra/caddy/Caddyfile).
#
# `demo` builds the client with the «Демо-данные» banner. It must match the VPS:
# a demo VPS has COMPOSE_FILE=docker-compose.yml:docker-compose.demo.yml in its
# .env (docs/ops/deploy.md «Демо-деплой без ключей»), and the run fails before
# touching the stack when the two disagree.
#
# Before production the schema is synced with `prisma db push` (no migrations).
# A push that would lose data fails instead of running.
#
# Repository secrets — Settings → Secrets and variables → Actions:
#   NEXT_PUBLIC_API_URL       baked into the web image at build time
#   NEXT_PUBLIC_SITE_URL      public site origin, baked into the web image at build time
#   DEPLOY_SSH_HOST           VPS
#   DEPLOY_SSH_USER
#   DEPLOY_SSH_KEY            private key — preferred
#   DEPLOY_SSH_PASSWORD       only used when no key is set
#   DEPLOY_SSH_PORT           optional, defaults to 22
#   DEPLOY_PATH               where docker-compose.yml lives, e.g. /opt/otmetki
#
# Runtime secrets live in the VPS .env, not here (docs/ops/deploy.md §1). The
# stack refuses to start without INTERNAL_API_TOKEN: the server validates it and
# docker-compose.yml passes it to the client, so the first `docker compose config`
# below already fails when it is missing.

on:
  workflow_dispatch:
    inputs:
      demo:
        description: Keyless demo on generated data (the VPS runs docker-compose.demo.yml)
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false

permissions: {}

jobs:
  # Every check runs here, before any image is built, so an image is never
  # pushed from a tree that would have failed.
  checks:
    permissions:
      contents: read

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      DATABASE_URL: postgresql://placeholder
      DIRECT_URL: postgresql://placeholder

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: bun run verify

      - run: bun run test

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      # The game modpack is Python 2.7 in the client; its suites run on Python 3.
      - run: bun run test:modpack

  # Playwright over the public pages. No API runs here: every page must render
  # its shell and fall back to its error state.
  e2e:
    permissions:
      contents: read

    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      DATABASE_URL: postgresql://placeholder
      DIRECT_URL: postgresql://placeholder

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Install the browser
        run: bunx playwright install --with-deps chromium

      - name: Build the client
        env:
          NEXT_PUBLIC_API_URL: https://api.invalid
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: bun --filter @otmetki/client build

      - name: Serve the client
        env:
          PORT: '3000'
          # Not 127.0.0.1: NextURL turns it into localhost, so the next-intl rewrite of a default-locale
          # path looks like another origin and loops back through the proxy as a redirect.
          HOSTNAME: 0.0.0.0
          # No API runs here; the Next server still signs its (failing) API calls.
          INTERNAL_API_TOKEN: e2e-internal-token-no-api-behind-it-000
        run: |
          cp -r apps/web/client/.next/static apps/web/client/.next/standalone/apps/web/client/.next/static
          cp -r apps/web/client/public apps/web/client/.next/standalone/apps/web/client/public 2>/dev/null || true

          node apps/web/client/.next/standalone/apps/web/client/server.js &
          echo "$!" > /tmp/web.pid

      - name: Run the smoke tests
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: bun run test:e2e

      - if: always()
        run: kill "$(cat /tmp/web.pid)" || true

      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-results
          path: e2e/.results/
          retention-days: 7

  client:
    needs: [checks, e2e]

    permissions:
      contents: read
      packages: write

    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/docker-image
        with:
          image: client
          dockerfile: apps/web/client/Dockerfile
          token: ${{ secrets.GITHUB_TOKEN }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_DEMO_MODE=${{ inputs.demo }}
            GIT_COMMIT_SHA=${{ github.sha }}

  server:
    needs: [checks, e2e]

    permissions:
      contents: read
      packages: write

    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/docker-image
        with:
          image: server
          dockerfile: apps/web/server/Dockerfile
          token: ${{ secrets.GITHUB_TOKEN }}

  vps:
    needs: [client, server]

    permissions:
      contents: read

    environment: production

    runs-on: ubuntu-24.04
    # A demo's first boot imports the game catalog and seeds inside `up -d`.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Paths are kept: compose bind-mounts ./infra/caddy/Caddyfile (and, for the
      # demo, ./infra/caddy/demo.caddy).
      - name: Copy the compose files and the Caddy config
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          source: docker-compose.yml,docker-compose.demo.yml,infra/caddy/Caddyfile,infra/caddy/demo.caddy
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Pull, sync the schema, restart
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEMO: ${{ inputs.demo }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          command_timeout: 40m
          envs: DEPLOY_PATH,DEMO
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"

            # The banner is baked into the client image, DEMO_MODE comes from the
            # compose files the VPS .env selects: both must say the same thing.
            stack=false
            if docker compose config --services | grep -qx demo-seed; then stack=true; fi
            if [ "$stack" != "$DEMO" ]; then
              echo "the run says demo=$DEMO but the VPS stack says demo=$stack (COMPOSE_FILE in $DEPLOY_PATH/.env)" >&2
              exit 1
            fi

            docker compose pull client server worker

            # --no-deps below starts nothing: on the very first run the database
            # is not up yet, so bring it (and Redis) up and wait for health first.
            docker compose up -d --wait postgres redis
            docker compose run --rm --no-deps server bun run db:deploy

            docker compose up -d
            docker image prune -f

            for container in otmetki-server otmetki-client; do
              for attempt in $(seq 1 30); do
                state=$(docker inspect -f '{{.State.Health.Status}}' "$container" 2>/dev/null || echo missing)

                [ "$state" = healthy ] && break

                if [ "$attempt" = 30 ]; then
                  echo "$container never became healthy (last state: $state)" >&2
                  docker compose logs --tail 50 >&2
                  exit 1
                fi

                sleep 5
              done
            done
