name: release

# Publishes a modpack release and the manager to the VPS, where everything is stored: no S3, no CDN,
# no GitHub Releases. Caddy serves DEPLOY_PATH/downloads at https://triotmetki.ru/downloads/ and the
# API answers GET /modpack/releases/latest from DEPLOY_PATH/downloads/releases.json (both mount the
# folder read-only, docker-compose.yml). Steps and first-release checklist: docs/ops/deploy.md §4.
#
# check    inputs and secrets, before anything is built.
# modpack  .github/actions/modpack-release (the same build as modpack.yml): the split packages, the
#          single otmetki.<version>.mtmod and the component catalogue. `version` must equal the
#          catalogue's modpackVersion (VERSION in apps/game/modpack/packages/companion/version.py).
# manager  `tauri build` with the release catalogue in tauri/resources: the NSIS installer and its
#          updater signature (.sig).
# publish  signs the release payload the manager verifies (apps/game/manager README «Patches and
#          updates»: minisign, the same key as the self-update, `tauri signer sign`), merges this
#          release into the published releases.json (a re-run of a version replaces it, older
#          versions stay, the manager block points at this installer), uploads everything to a
#          staging folder beside downloads/ and moves it into place over SSH, releases.json last.
#
# Resulting layout of DEPLOY_PATH/downloads:
#   modpack/<version>/*.mtmod, catalog/components.json, catalog/previews/   cached for a year
#   manager/<manager version>/otmetki-manager_<v>_x64-setup.exe (+ .sig)     cached for a year
#   otmetki-manager-setup.exe, otmetki.mtmod                                 the site's /mod links
#   releases.json                                                            the index
#
# Secrets (environment `production` or repository), in addition to deploy.yml's:
#   TAURI_SIGNING_PRIVATE_KEY           minisign private key; its public half is plugins.updater.pubkey
#                                       in apps/game/manager/tauri/tauri.conf.json (= RELEASE_PUBLIC_KEY)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password; may stay empty for a key without one
#   NEXT_PUBLIC_SITE_URL, DEPLOY_SSH_HOST, DEPLOY_SSH_USER, DEPLOY_SSH_PASSWORD, DEPLOY_SSH_PORT
#   (optional), DEPLOY_PATH             the same values deploy.yml uses

on:
  workflow_dispatch:
    inputs:
      version:
        description: Modpack version to publish (semver, = VERSION in packages/companion/version.py)
        required: true
        type: string
      games:
        description: Game client versions it supports, comma-separated (1.46.* or 1.46.0.0)
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  check:
    permissions: {}

    environment: production

    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check the inputs and the secrets
        env:
          VERSION: ${{ inputs.version }}
          GAMES: ${{ inputs.games }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PASSWORD: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          failed=0

          for name in TAURI_SIGNING_PRIVATE_KEY NEXT_PUBLIC_SITE_URL DEPLOY_SSH_HOST DEPLOY_SSH_USER DEPLOY_SSH_PASSWORD DEPLOY_PATH; do
            if [ -z "${!name}" ]; then
              echo "::error::secret $name is not set (docs/ops/deploy.md §1 «GitHub repository secrets»)"
              failed=1
            fi
          done

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z_.]+)?$ ]]; then
            echo "::error::version '$VERSION' is not semver (0.2.0)"
            failed=1
          fi

          if [[ ! "$GAMES" =~ ^[0-9]+(\.([0-9]+|\*)){1,3}(\ *,\ *[0-9]+(\.([0-9]+|\*)){1,3})*$ ]]; then
            echo "::error::games '$GAMES' is not a comma-separated list of client versions (1.46.* or 1.46.0.0)"
            failed=1
          fi

          if [[ -n "$NEXT_PUBLIC_SITE_URL" && "$NEXT_PUBLIC_SITE_URL" != https://* ]]; then
            echo "::error::NEXT_PUBLIC_SITE_URL must be https: the manager downloads only over https"
            failed=1
          fi

          exit "$failed"

  modpack:
    needs: check

    permissions:
      contents: read

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/modpack-release

      - name: Check the version against the catalogue
        env:
          VERSION: ${{ inputs.version }}
        run: |
          built=$(jq -r .modpackVersion dist/catalog/components.json)

          if [ "$built" != "$VERSION" ]; then
            echo "::error::the build is modpack $built, not $VERSION: bump VERSION in apps/game/modpack/packages/companion/version.py or run with version $built"
            exit 1
          fi

          test -f "dist/modpack/otmetki.$VERSION.mtmod"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-modpack
          path: dist/modpack/
          retention-days: 1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-catalog
          path: dist/catalog/
          retention-days: 1

  manager:
    needs: modpack

    permissions:
      contents: read

    environment: production

    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/game/manager/tauri -> target

      # The committed resources/components.json is an empty placeholder; the installer ships this
      # release's catalogue so a fresh install needs no download before the first release check.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-catalog
          path: apps/game/manager/tauri/resources

      - name: Build the installer
        shell: bash
        working-directory: apps/game/manager
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          bun run build

          shopt -s nullglob
          installers=(tauri/target/release/bundle/nsis/*-setup.exe)

          if [ "${#installers[@]}" -ne 1 ] || [ ! -f "${installers[0]}.sig" ]; then
            echo "::error::expected one NSIS installer with its .sig, found: ${installers[*]:-none}"
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-manager
          path: |
            apps/game/manager/tauri/target/release/bundle/nsis/*-setup.exe
            apps/game/manager/tauri/target/release/bundle/nsis/*-setup.exe.sig
          retention-days: 1

  publish:
    needs: [modpack, manager]

    permissions:
      contents: read

    environment: production

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      VERSION: ${{ inputs.version }}
      GAMES: ${{ inputs.games }}
      SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      STAGING: ${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-modpack
          path: dist/modpack

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-catalog
          path: dist/catalog

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-manager
          path: dist/manager

      # 404 means no release was published yet. Any other failure stops the run: starting a new
      # index from scratch would drop every published release.
      - name: Read the published index
        run: |
          url="${SITE_URL%/}/downloads/releases.json"
          status=$(curl -sS --retry 3 -o dist/current.json -w '%{http_code}' "$url")

          case "$status" in
            200) echo "extending $url" ;;
            404) rm -f dist/current.json && echo "no index at $url yet: starting a new one" ;;
            *) echo "::error::GET $url answered $status" && exit 1 ;;
          esac

      - name: Describe the release
        run: |
          downloads="${SITE_URL%/}/downloads"
          manager_version=$(jq -r .version apps/game/manager/package.json)
          installer=$(find dist/manager -name '*-setup.exe' -print -quit)

          {
            echo "DOWNLOADS=$downloads"
            echo "MANAGER_VERSION=$manager_version"
            echo "MANAGER_FILE=otmetki-manager_${manager_version}_x64-setup.exe"
            echo "INSTALLER=$installer"
          } >> "$GITHUB_ENV"

      - name: Build the release entry and its payload
        run: |
          bun apps/web/server/scripts/modpack-release.ts prepare \
            --version "$VERSION" --games "$GAMES" \
            --catalog dist/catalog/components.json --packages dist/modpack \
            --base-url "$DOWNLOADS/modpack/$VERSION" --out dist/release

      - name: Sign the payload
        working-directory: apps/game/manager
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bunx tauri signer sign "$GITHUB_WORKSPACE/dist/release/release.txt"

      - name: Lay out the downloads folder
        run: |
          publish=dist/publish
          mkdir -p "$publish/modpack/$VERSION/catalog" "$publish/manager/$MANAGER_VERSION"

          cp dist/modpack/*.mtmod "$publish/modpack/$VERSION/"
          cp -R dist/catalog/. "$publish/modpack/$VERSION/catalog/"
          cp "dist/modpack/otmetki.$VERSION.mtmod" "$publish/otmetki.mtmod"
          cp "$INSTALLER" "$publish/manager/$MANAGER_VERSION/$MANAGER_FILE"
          cp "$INSTALLER.sig" "$publish/manager/$MANAGER_VERSION/$MANAGER_FILE.sig"
          cp "$INSTALLER" "$publish/otmetki-manager-setup.exe"

          bun apps/web/server/scripts/modpack-release.ts index \
            --current dist/current.json \
            --release dist/release/release.json --signature dist/release/release.txt.sig \
            --manager-version "$MANAGER_VERSION" --manager-url "$DOWNLOADS/manager/$MANAGER_VERSION/$MANAGER_FILE" \
            --manager-signature "$INSTALLER.sig" \
            --out "$publish/releases.json"

          find "$publish" -type f | sort

      # Nothing lands in downloads/ yet: the upload goes to a staging folder beside it.
      - name: Upload to the VPS
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          source: dist/publish
          target: ${{ secrets.DEPLOY_PATH }}/.downloads-staging/${{ env.STAGING }}
          strip_components: 2
          overwrite: true

      # Renames within one file system, so each file switches at once; releases.json goes last,
      # so the index never names a file that is not in place. A re-run replaces the same paths.
      - name: Publish
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          envs: DEPLOY_PATH,STAGING,VERSION,MANAGER_VERSION
          script: |
            set -euo pipefail

            downloads="$DEPLOY_PATH/downloads"
            staging="$DEPLOY_PATH/.downloads-staging/$STAGING"
            trap 'rm -rf "$staging"' EXIT

            if [ ! -d "$downloads" ]; then
              echo "$downloads does not exist: create it once (mkdir -p $downloads) and redeploy (docs/ops/deploy.md)" >&2
              exit 1
            fi

            chmod -R a+rX "$staging"
            mkdir -p "$downloads/modpack" "$downloads/manager"

            for dir in "modpack/$VERSION" "manager/$MANAGER_VERSION"; do
              rm -rf "$downloads/$dir.old"
              if [ -e "$downloads/$dir" ]; then
                mv "$downloads/$dir" "$downloads/$dir.old"
              fi
              mv "$staging/$dir" "$downloads/$dir"
              rm -rf "$downloads/$dir.old"
            done

            for file in otmetki.mtmod otmetki-manager-setup.exe releases.json; do
              mv -f "$staging/$file" "$downloads/$file"
            done

            echo "published modpack $VERSION and manager $MANAGER_VERSION to $downloads"
